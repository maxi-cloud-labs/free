<footer class="border-t border-white/25 px-4 py-8 sm:px-6 lg:px-8">
	<div class="flex w-full flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
		<div class="flex min-w-0 flex-wrap items-center gap-x-4 gap-y-4">
			<a routerLink="/" class="inline-flex shrink-0 items-baseline rounded-lg leading-none focus-visible:outline-none focus-visible:border-2 focus-visible:border-white/70">
				<span class="text-xl sm:text-2xl font-extrabold text-white">m</span><span class="text-xl sm:text-2xl font-extrabold text-red-600">A</span><span class="text-xl sm:text-2xl font-extrabold text-white">x</span><span class="text-xl sm:text-2xl font-extrabold text-red-600 font-[monospace]">I</span><span class="text-xl sm:text-2xl font-extrabold text-white">.</span>
				<span class="inline-block bg-[url('/assets/images/logo-cloud2.png')] bg-size-[55px_30px] bg-top-right bg-no-repeat pr-2 text-xl sm:pr-4 sm:text-3xl font-extrabold text-red-600">C<span class="text-xs">loud</span></span>
			</a>
			<p class="text-sm leading-relaxed">&copy; 2026. {{LG("All rights reserved.")}}<br>{{LG("Patent pending")}}</p>
			<div class="flex items-center gap-1">
				<a href="https://linkedin.com/in/GregoireGentil/" target="_blank" rel="noopener noreferrer" class="flex h-10 w-10 items-center justify-center rounded-xl transition-colors hover:bg-modernsecond hover:text-white focus-visible:outline-none focus-visible:border-2 focus-visible:border-white/70"><ion-icon name="logo-linkedin" class="h-5 w-5"></ion-icon></a>
				<a href="https://github.com/maxi-cloud-labs/free" target="_blank" rel="noopener noreferrer" class="flex h-10 w-10 items-center justify-center rounded-xl transition-colors hover:bg-modernsecond hover:text-white focus-visible:outline-none focus-visible:border-2 focus-visible:border-white/70"><ion-icon name="logo-github" class="h-5 w-5"></ion-icon></a>
			</div>
		</div>
		<label class="relative flex h-10 w-fit items-center gap-2 rounded-xl border-1 border-white/25 px-4 text-sm transition-colors hover:bg-modernsecond focus-within:border-white/70">
			<ion-icon name="language-outline" class="h-5 w-5" aria-hidden="true"></ion-icon>
			<select [value]="global.settings.lang" (change)="global.changeLanguage($any($event.target).value);" class="cursor-pointer bg-transparent text-white focus:outline-none">
				<option *ngFor="let lang of global.languages" [value]="lang.code" [lang]="lang.code" [selected]="lang.code == global.settings.lang" class="bg-modernsecond text-white">{{lang.name}}</option>
			</select>
		</label>
		<nav class="flex flex-wrap items-center gap-x-8 gap-y-2 text-sm lg:justify-end" *ngIf="global.demo">
			<a routerLink="/pricing">{{LG("Pricing")}}</a>
			<a routerLink="/buy">{{LG("Buy")}}</a>
			<a href="https://docs.maxi.cloud" target="_blank" rel="noopener noreferrer">{{LG("Docs")}}</a>
			<a routerLink="/terms">{{LG("Terms")}}</a>
			<a routerLink="/privacy">{{LG("Privacy Policy")}}</a>
			<a href="mailto:@maxi.cloud">{{LG("Contact")}}</a>
		</nav>
		<nav class="flex flex-wrap items-center gap-x-8 gap-y-2 text-sm lg:justify-end" *ngIf="!global.demo">
			<a href="https://docs.maxi.cloud" target="_blank" rel="noopener noreferrer">{{LG("Docs")}}</a>
			<a href="mailto:support@maxi.cloud">{{LG("Support")}}</a>
			<a routerLink="/terms">{{LG("Terms")}}</a>
			<a routerLink="/privacy">{{LG("Privacy Policy")}}</a>
		</nav>
	</div>
</footer>
