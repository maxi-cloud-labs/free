<div class="min-h-screen bg-slate-950 text-white">
	<ng-template><app-sidebar title="About"></app-sidebar></ng-template>
	<div class="mx-auto flex min-w-0 max-w-[1600px] flex-col pb-10">
		<app-modernbar #modernbar></app-modernbar>
		<ng-template><app-topbar [title]="L('About mAxI.cloud')"></app-topbar></ng-template>
		<h1 class="px-4 pt-6 pb-2 text-2xl font-bold tracking-tight sm:px-6 sm:text-3xl lg:px-8">{{L('About mAxI.cloud')}}</h1>
		<div class="m-4 flex min-w-0 flex-col gap-5 rounded-2xl bg-modernsecond p-5 ring-1 ring-white/10 sm:m-6 sm:p-6 lg:mx-8">
			<div long-press (press)="longCopyright()" class="font-bold cursor-pointer">&copy; {{L("Copyright")}} <b><span class="text-white">m</span><span class="text-red-400">A</span><span class="text-white">x</span><span class="text-red-400 text-[1.04rem] font-[monospace]">I</span><span class="text-white">.cloud</span></b> 2026.</div>
			<div>{{L("App Version:")}} {{global.VERSION}} ({{LG(global.getMonth(global.VERSION))}})</div>
			<div *ngIf="global.developer">{{L("The developer mode is enabled.")}}</div>
		</div>
	</div>
</div>
